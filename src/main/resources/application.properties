# HTTP port the embedded Tomcat listens on
server.port=8080

# SMPP connection to the Osmocom SMSC (osmo-msc exposes SMPP on 2775 by default)
smpp.enabled=true
smpp.host=127.0.0.1
smpp.port=2775
smpp.systemId=smsclient
smpp.password=password
smpp.systemType=

# AI spam classification service
ai.classify.url=http://localhost:5000/classify
ai.connectTimeoutMs=3000
ai.readTimeoutMs=5000

# If true, messages classified as spam are stored but never submitted to the SMSC
sms.blockSpam=false
