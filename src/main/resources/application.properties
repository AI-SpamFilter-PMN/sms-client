# HTTP port the embedded Tomcat listens on
server.port=8080

# SMPP connection to the teammate's SMPP server (does spam classification,
# forwards to Osmocom or blocks, and writes the result to Neon)
smpp.enabled=true
smpp.host=127.0.0.1
smpp.port=2076
smpp.systemId=smsclient
smpp.password=password
smpp.systemType=

# Neon (Postgres) connection string - read-only, used to display message
# history written by the SMPP server. Never put the real value here; set it
# via -Ddb.url=... or the DB_URL environment variable at launch instead.
db.url=
